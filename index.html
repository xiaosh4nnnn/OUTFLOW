<script>
const CATS=[["Home & Utilities","The ongoing cost of your home: electricity, water, internet, rent, and other utilities.","#3F6283"],["Household Essentials","Things used around the home: cleaning, toiletries, kitchen, laundry, and small necessities.","#F28C28"],["Grocery Shopping","Food and ingredients bought for home, from vegetables and meat to drinking water.","#7DBB47"],["Health","Medical and health-related spending including doctors, medication, vitamins, tests, and care.","#E3433A"],["Skincare / Personal Care","Skincare, haircare, cosmetics, salon visits, haircuts, and personal upkeep.","#B08AAE"],["Dining Out","Meals not prepared at home, including restaurants, delivery, takeaway, and meals outside.","#F6A94D"],["Snacks","Small bites, treats, street snacks, convenience-store snacks, drinks, and desserts.","#9CC9E6"],["Coffee","Coffee shops, coffee drinks, café visits, beans, and casual café hangouts.","#B8322B"],["Wellness","Spending focused on relaxation and wellbeing, including massage, spa, and wellness activities.","#5FA136"],["Shopping","Lifestyle and want-based purchases such as clothes, shoes, bags, and accessories.","#8E6A8D"],["Travel","Spending that happens as part of a trip: flights, hotels, meals, tickets, parking, and fuel.","#6C8FB0"],["Entertainment","Activities primarily for fun: cinema, concerts, shows, attractions, events, and games.","#F0766E"],["Work / Business","Expenses directly related to projects, work, business purchases, and operating costs.","#A8D37A"],["Vehicles","Car and motorbike costs including fuel, parking, servicing, repairs, tax, washing, and accessories.","#D9701A"],["Miscellaneous","Gifts, donations, giving, and unusual one-off expenses that genuinely fit nowhere else.","#C9A9C6"]].map(c=>({n:c[0],d:c[1],c:c[2]}));
const ci=n=>Math.max(0,CATS.findIndex(c=>c.n===n)),colr=n=>CATS[ci(n)].c;
const MN=["January","February","March","April","May","June","July","August","September","October","November","December"];
const IC={home:'<path d="M4 11l8-7 8 7v9H4z"/>',tx:'<path d="M4 7h16M4 12h10M4 17h16"/>',monthly:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',yearly:'<path d="M5 20V10M10 20V5M15 20v-7M20 20H3"/>',more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>'};
const ico=k=>`<svg class="i" viewBox="0 0 24 24">${IC[k]}</svg>`,CH='<svg class="i" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>',CD='<svg class="i" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>';
const $=s=>document.querySelector(s),p2=n=>String(n).padStart(2,"0");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rp=n=>"Rp "+Math.round(n).toLocaleString("id-ID");
const sh=n=>n>=1e6?"Rp"+(n/1e6).toFixed(1).replace(".",",")+"M":rp(n);
const todayStr=()=>{const d=new Date();return`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`};
const ml=m=>MN[+m.slice(5)-1]+" "+m.slice(0,4),fd=d=>{const[y,m,x]=d.split("-");return`${MN[m-1].slice(0,3)} ${+x}, ${y}`};
let S={tab:"home",month:todayStr().slice(0,7),year:todayStr().slice(0,4),fm:"all",cat:"All",q:"",cmpA:null,cmpB:null,tx:[],bd:{},inc:[],inv:[],px:{},priv:[],shared:new Set(),miss:0,sync:"local",open:{},bdc:"Vehicles"};
/* ---------- data layer (separate from UI) ---------- */
const LS="outflow_tx_v1",LB="outflow_bd_v1",LI="outflow_inc_v1",LV="outflow_inv_v1",LP="outflow_px_v1",strip=t=>{const{id,...r}=t;return r};
const store={col:null,
 async init(){try{localStorage.setItem("__t","1");localStorage.removeItem("__t")}catch(e){S.warn=1}this.loadLocal()},
 loadLocal(){try{S.tx=JSON.parse(localStorage.getItem(LS)||"[]");S.bd=JSON.parse(localStorage.getItem(LB)||"{}");S.inc=JSON.parse(localStorage.getItem(LI)||"[]");S.inv=JSON.parse(localStorage.getItem(LV)||"[]");S.px=JSON.parse(localStorage.getItem(LP)||"{}")}catch(e){}render()},
 keep(){try{localStorage.setItem(LS,JSON.stringify(S.tx));localStorage.setItem(LB,JSON.stringify(S.bd));localStorage.setItem(LI,JSON.stringify(S.inc));localStorage.setItem(LV,JSON.stringify(S.inv));localStorage.setItem(LP,JSON.stringify(S.px))}catch(e){S.warn=1}},
 async save(t){const i=S.tx.findIndex(x=>x.id===t.id);if(i>=0)S.tx[i]=t;else S.tx.push(t);this.keep();
  if(this.col){try{await this.col.doc(t.id).set(strip(t))}catch(e){alert("Could not sync this change; it is saved on this device.")}}render()},
 async del(id){S.tx=S.tx.filter(t=>t.id!==id);this.keep();if(this.col){try{await this.col.doc(id).delete()}catch(e){}}render()},
 async saveBd(){this.keep();if(this.col){try{await this.col.doc("_bd").set({map:S.bd})}catch(e){}}render()},
 async put(k,r){const a=S[k],i=a.findIndex(x=>x.id===r.id);if(i>=0)a[i]=r;else a.push(r);this.keep();if(this.col){try{await this.col.doc(r.id).set(strip(r))}catch(e){alert("Could not sync this change; it is saved on this device.")}}render()},
 async rm(k,id){S[k]=S[k].filter(x=>x.id!==id);this.keep();if(this.col){try{await this.col.doc(id).delete()}catch(e){}}render()},
 async savePx(){this.keep();if(this.col){try{await this.col.doc("_px").set({map:S.px})}catch(e){}}render()}};
const TH="outflow_theme_v1";function setTheme(v){try{localStorage.setItem(TH,v)}catch(e){}const r=document.documentElement;if(v==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",v)}
/* ---------- helpers ---------- */
const sum=a=>a.reduce((s,t)=>s+t.amount,0),inM=(m)=>S.tx.filter(t=>t.date.startsWith(m));
const byDate=a=>[...a].sort((x,y)=>y.date.localeCompare(x.date)||(y.createdAt||"").localeCompare(x.createdAt||""));
const months=()=>[...new Set([...S.tx.map(t=>t.date.slice(0,7)),todayStr().slice(0,7),S.month,S.cmpA,S.cmpB].filter(Boolean))].sort().reverse();
const years=()=>[...new Set([...S.tx.map(t=>t.date.slice(0,4)),S.year])].sort().reverse();
const mopt=(sel,all)=>(all?`<option value="all" ${sel==="all"?"selected":""}>All months</option>`:"")+months().map(m=>`<option value="${m}" ${m===sel?"selected":""}>${ml(m)}</option>`).join("");
const sel=(k,o)=>`<select class="pill" data-sel="${k}">${o}</select>`;
const prevM=m=>{let y=+m.slice(0,4),x=+m.slice(5)-1;if(!x){y--;x=12}return`${y}-${p2(x)}`};
const byCat=a=>CATS.map(c=>({...c,v:sum(a.filter(t=>t.category===c.n))}));
const head=(e,t,r)=>`<div class="hd"><div><div class="eye">${e}</div><h2>${t}</h2></div>${r||""}</div>`;
function chart(a,lab){const rows=byCat(a),T=sum(a),pos=rows.filter(r=>r.v>0),Ro=105,Ri=71,P=(r,t)=>[(110+r*Math.cos(t)).toFixed(3),(110+r*Math.sin(t)).toFixed(3)];
 let t0=-Math.PI/2,arcs="";
 if(pos.length===1)arcs=`<circle r="88" cx="110" cy="110" fill="none" stroke="${pos[0].c}" stroke-width="34"/>`;
 else pos.forEach(r=>{const t1=t0+r.v/T*2*Math.PI,big=t1-t0>Math.PI?1:0,[x0,y0]=P(Ro,t0),[x1,y1]=P(Ro,t1),[x2,y2]=P(Ri,t1),[x3,y3]=P(Ri,t0);arcs+=`<path d="M${x0} ${y0}A${Ro} ${Ro} 0 ${big} 1 ${x1} ${y1}L${x2} ${y2}A${Ri} ${Ri} 0 ${big} 0 ${x3} ${y3}Z" fill="${r.c}" stroke="var(--bg)" stroke-width="2" stroke-linejoin="round"/>`;t0=t1});
 const svg=`<svg role="img" aria-label="${esc(lab)} spending by category" viewBox="0 0 220 220" style="width:100%;max-width:240px;margin:auto;display:block"><circle r="88" cx="110" cy="110" fill="none" stroke="var(--fill)" stroke-width="34"/>${arcs}<text x="110" y="104" text-anchor="middle" font-size="11" letter-spacing="1.5" fill="var(--mute)">${esc(lab)}</text><text x="110" y="128" text-anchor="middle" font-size="19" font-weight="700" fill="var(--fg)">${sh(T)}</text></svg>`;
 const lg=rows.filter(r=>r.v>0).map(r=>`<div class="r"><span><i class="dot" style="background:${r.c}"></i>${esc(r.n)}</span><b>${rp(r.v)}</b></div>`).join("");
 return`<div class="split">${svg}<div class="leg">${lg||'<p class="note">Nothing recorded yet.</p>'}</div></div>`}
